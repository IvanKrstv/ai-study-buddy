<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Buddy</title>

    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>

    <main class="page">

        <div class="container">

            <header class="header">

                <div class="brand">
                    <div class="brand-mark">S</div>
                    <span>AI Study Buddy</span>
                </div>

                <div class="language-switcher">
                    <button class="lang-btn active" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="bg">BG</button>
                </div>

                <h1 data-i18n="header.title"></h1>
                <p data-i18n="header.paragraph"></p>

            </header>


            <section class="study-card">

                <div class="section">

                    <label class="section-label" data-i18n="upload.instructions"></label>

                    <div class="upload-area" id="upload-area">
                        <input type="file" id="file-input" accept=".pdf,.docx,.txt" hidden>

                        <div class="upload-content">

                            <div class="upload-icon">↑</div>
                            <div class="upload-title" data-i18n="upload.drop_file"></div>
                            <div class="upload-description" data-i18n="upload.choose_file"></div>
                            <div class="browse-button" data-i18n="upload.browse"></div>
                            <div class="file-info" data-i18n="upload.file_types"></div>

                        </div>
                    </div>
                </div>


                <div class="section">

                    <label class="section-label" data-i18n="selected_file"></label>

                    <div class="selected-file">

                        <div class="file-details">
                            <div class="file-icon" id="file-icon">PDF</div>

                            <div>
                                <div class="file-name" id="file-name">
                                    lecture-notes.pdf
                                </div>

                                <div class="file-status" data-i18n="selected_file.generation"></div>
                            </div>

                        </div>

                        <button class="remove-file" type="button">×</button>

                    </div>

                </div>


                <div class="section">

                    <label class="section-label" data-i18n="generation.question"></label>

                    <div class="options">

                        <div class="option active" id="summary">

                            <div class="option-title" data-i18n="generation.summary"></div>
                            <div class="option-description" data-i18n="generation.summary_text"></div>

                        </div>


                        <div class="option" id="quiz">

                            <div class="option-title" data-i18n="generation.quiz"></div>
                            <div class="option-description" data-i18n="generation.quiz_text"></div>

                        </div>


                        <div class="option" id="flashcards">

                            <div class="option-title" data-i18n="generation.flashcards"></div>
                            <div class="option-description" data-i18n="generation.flashcards_text"></div>

                        </div>

                    </div>

                </div>

                <div class="section">
                    <button class="generate-button" id="generate-button" type="button" data-i18n="generate"></button>
                </div>

            </section>


            <section class="result" id="result-section">

                <div class="result-header">

                    <h2 class="result-title" data-i18n="results.title.summary"></h2>

                </div>

                <div class="result-content">

                    <p></p>

                </div>

            </section>


            <section class="quiz-section" id="quiz-section">

                <div class="quiz-header">

                    <h2 class="quiz-title" data-i18n="results.title.quiz"></h2>
                    <span class="quiz-progress" id="quiz-progress"></span>

                </div>

                <div class="quiz-progress-bar">
                    <div class="quiz-progress-fill" id="quiz-progress-fill"></div>
                </div>

                <div class="quiz-question-text" id="quiz-question-text"></div>

                <div class="quiz-options" id="quiz-options"></div>

                <div class="quiz-explanation" id="quiz-explanation">

                    <div class="quiz-explanation-icon" id="quiz-explanation-icon"></div>

                    <div>
                        <div class="quiz-explanation-title" id="quiz-explanation-title"></div>
                        <div class="quiz-explanation-text" id="quiz-explanation-text"></div>
                    </div>

                </div>

                <div class="quiz-nav">
                    <button class="quiz-nav-btn" id="quiz-next-btn" data-i18n="quiz.next"></button>
                </div>

            </section>


            <section class="quiz-score" id="quiz-score-section">

                <div class="quiz-score-icon">🎉</div>
                <h2 class="quiz-score-title" data-i18n="quiz.complete"></h2>
                <div class="quiz-score-value" id="quiz-score-value"></div>
                <p class="quiz-score-message" id="quiz-score-message"></p>

                <button class="generate-button quiz-retry-btn" id="quiz-retry-btn" data-i18n="quiz.retry"></button>

            </section>


            <section class="flashcard-section" id="flashcard-section">

                <div class="flashcard-header">

                    <h2 class="flashcard-title" data-i18n="results.title.flashcards"></h2>
                    <span class="flashcard-progress" id="flashcard-progress"></span>

                </div>

                <div class="flashcard-progress-bar">
                    <div class="flashcard-progress-fill" id="flashcard-progress-fill"></div>
                </div>

                <div class="flashcard-container" id="flashcard-container">

                    <div class="flashcard" id="flashcard">

                        <div class="flashcard-face flashcard-front">
                            <div class="flashcard-label" data-i18n="flashcard.question"></div>
                            <div class="flashcard-text" id="flashcard-front-text"></div>
                        </div>

                        <div class="flashcard-face flashcard-back">
                            <div class="flashcard-label" data-i18n="flashcard.answer"></div>
                            <div class="flashcard-text" id="flashcard-back-text"></div>
                        </div>

                    </div>

                </div>

                <div class="flashcard-hint" data-i18n="flashcard.hint"></div>

                <div class="flashcard-nav">

                    <button class="flashcard-nav-btn flashcard-prev-btn" id="flashcard-prev-btn" data-i18n="flashcard.prev"></button>
                    <button class="flashcard-nav-btn flashcard-next-btn" id="flashcard-next-btn" data-i18n="flashcard.next"></button>

                </div>

            </section>

        </div>

    </main>

<script src="script.js"></script>
</body>
</html>
